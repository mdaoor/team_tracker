repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^(packages/schema/src|apps/server/tt_server)/
        additional_dependencies: [pydantic, types-PyYAML, sqlalchemy]
  - repo: local
    hooks:
      - id: prettier-web
        name: prettier (web)
        entry: pnpm --filter @tt/web exec prettier --check
        language: system
        files: ^apps/web/
        pass_filenames: false
