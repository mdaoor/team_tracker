name: ci
on:
  push: { branches: [main, "phase/**", "claude/**"] }
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: tt_test, POSTGRES_USER: tt, POSTGRES_PASSWORD: tt }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TT_TEST_DATABASE_URL: postgresql+psycopg://tt:tt@localhost:5432/tt_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages/schema/src packages/client_core/src apps/cli/tt_cli apps/server/tt_server apps/llm_gateway/tt_llm packages/filter_grammar/src packages/cel_policies/src
      - run: uv run pytest -q --cov=tt_schema --cov=tt_server --cov=tt_client --cov=tt_cli --cov=tt_llm --cov=tt_filter --cov=tt_cel --cov-fail-under=75 --timeout=120
      - name: OpenAPI snapshot is up to date
        run: |
          uv run python -m tt_server.openapi docs/api/openapi.json
          git diff --exit-code docs/api/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tt/web lint
      - run: pnpm --filter @tt/web typecheck
      - run: pnpm --filter @tt/web test
      - run: pnpm --filter @tt/web build
      - name: Generated API types are up to date
        run: |
          pnpm --filter @tt/web gen:api
          git diff --exit-code apps/web/src/api/schema.d.ts

  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tt/presentation lint
      - run: pnpm --filter @tt/presentation test
      - run: pnpm --filter @tt/presentation build
      - run: pnpm --filter @tt/presentation exec playwright install --with-deps chromium
      - run: pnpm --filter @tt/presentation exec playwright test
      - name: Snapshot / presentation schemas are up to date
        run: |
          pip install uv && uv sync --all-packages --frozen
          uv run python tools/gen_schemas.py
          git diff --exit-code docs/api/snapshot-schema.json docs/api/presentation-schema.json
