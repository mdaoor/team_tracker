[project]
name = "tt-cli"
version = "0.1.0"
description = "Team Tracker reporter CLI (filled in by Phase 2)"
requires-python = ">=3.12"
dependencies = ["tt-schema", "tt-client", "typer>=0.12", "httpx>=0.27", "rich>=13", "questionary>=2"]

[project.scripts]
tt = "tt_cli.main:app"
tt-sidecar = "tt_cli.sidecar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tt_cli"]
