[project]
name = "tt-cli"
version = "0.1.0"
description = "Team Tracker reporter CLI (filled in by Phase 2)"
requires-python = ">=3.12"
dependencies = ["tt-schema", "typer>=0.12", "httpx>=0.27"]

[project.scripts]
tt = "tt_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tt_cli"]
