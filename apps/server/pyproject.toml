[project]
name = "tt-server"
version = "0.1.0"
description = "Team Tracker API server"
requires-python = ">=3.12"
dependencies = [
  "tt-schema",
  "tt-filter",
  "tt-cel",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "procrastinate>=2.0",
  "typer>=0.12",
  "pyyaml>=6",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "ldap3>=2.9",
  "authlib>=1.3",
  "itsdangerous>=2.2",
  "httpx>=0.27",
  "cryptography>=43",
  "python-pptx>=1.0.2",
  "playwright>=1.64.1",
  "python-dateutil>=2.9",
  "types-croniter>=6.2.4.20261006",
  "prometheus-client>=0.26.0",
]

[project.scripts]
tt-admin = "tt_server.admin:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tt_server"]
