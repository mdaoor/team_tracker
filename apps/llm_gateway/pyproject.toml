[project]
name = "tt-llm-gateway"
version = "0.1.0"
description = "Team Tracker LLM gateway: LiteLLM routing, agentic capture, summaries, suggestions"
requires-python = ">=3.12"
dependencies = [
  "tt-schema",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "litellm>=1.50",
  "httpx>=0.27",
  "pydantic-settings>=2.3",
  "pyyaml>=6",
  "structlog>=24.1",
  "sqlalchemy[asyncio]>=2.0.30",
  "psycopg[binary,pool]>=3.2",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "typer>=0.12",
  "jsonschema>=4.20",
]

[project.scripts]
tt-llm = "tt_llm.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tt_llm"]
