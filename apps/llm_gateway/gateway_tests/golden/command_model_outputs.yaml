# Recorded answers of the scripted model for gateway_tests/test_translate_command.py (one per line of the golden set in
# packages/client_core/tests/golden/command_lines.yaml). The harness answers ONLY from this file, never from the golden's
# expected `commands`, so accuracy is measured against an independent answer. `kind` says what is wrong with it:
#   ok                  the model got it right
#   wrong_op            a plausible but wrong op with valid arguments (counts against op accuracy)
#   wrong_arg           the right op with one wrong argument value (counts against argument accuracy)
#   partial             a multi-command line where the model stopped early (counts against op accuracy)
#   imperfect_absorbed  invented op / person / key / forced meta that the gateway must drop or repair (no score loss)
# The test pins the exact scores that follow from these kinds and checks that each wrong answer is reported as a miss.
