[project]
name = "tt-cel"
version = "0.1.0"
description = "Team Tracker policy language: CEL context schema v1, static checker, template compiler, registered functions"
requires-python = ">=3.12"
dependencies = ["cel-python>=0.2", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tt_cel"]
