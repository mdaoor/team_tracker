key: development_hours_below
name: "Little time on development"
description: "A person logged fewer hours than planned on #development work (training, courses, reading) in the last 7 days. Positive-habit nudge, wellbeing category: visible to the person and their line manager only."
category: wellbeing
severity: info
target: person
trigger: scheduled
schedule: "0 8 * * 1"
params:
  - {name: hours, type: int, default: 2, min: 1, max: 40, help: "Hours per week on development work"}
cel: >-
  metrics.development_minutes(person.id, "7d") < 60 * {hours}
detail: "{metrics.development_minutes(person.id, \"7d\")} min on development in 7 days (target {hours} h)"
example: "35 min on development in 7 days (target 2 h)"
