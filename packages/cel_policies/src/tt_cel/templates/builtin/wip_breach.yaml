key: wip_breach
name: "WIP above the limit"
description: "More items sit in a stage than its WIP limit (or the `limit` parameter). One violation per project and stage."
category: process
severity: violation
target: stage_placement
trigger: on_event
event_types: [item.stage_changed, stage.moved]
grouping: project_stage
params:
  - {name: limit, type: int, default: null, min: 1, max: 1000, help: "Limit; empty = the stage's own WIP limit"}
cel: >-
  {limit|stage.wip_limit} != null && stage.wip_count() > {limit|stage.wip_limit}
detail: "WIP {stage.wip_count()} > limit {limit|stage.wip_limit}"
candidate_filter: {state: {category: [open, active]}}
example: "WIP 6 > limit 4"
