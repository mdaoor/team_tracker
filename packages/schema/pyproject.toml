[project]
name = "tt-schema"
version = "0.1.0"
description = "Team Tracker schema package: enums and Pydantic models ported from docs/spec/team_tracker_models.py"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "uuid-utils>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tt_schema"]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "hypothesis>=6.170.8",
]
