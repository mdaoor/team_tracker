[project]
name = "tt-client"
version = "0.1.0"
description = "Team Tracker reporter client core: structured parser, ContextPack cache, offline queue, translator client"
requires-python = ">=3.12"
dependencies = [
    "tt-schema",
    "httpx>=0.27",
    "dateparser>=1.2",
    "pyyaml>=6",
    "python-dateutil>=2.9",
    "cryptography>=43",
    "keyring>=25",
]

[project.scripts]
tt-eval = "tt_client.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tt_client"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
