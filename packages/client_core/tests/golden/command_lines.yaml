  - line: "rename the website project to Website 2"
    commands: [{op: project.update, args: {project: WEB, name: Website 2}}]
  - line: "put @sara on the site project as a member"
    commands: [{op: project.add_member, args: {project: WEB, person: "@sara", role: contributor}}]
  - line: "make @ali the lead of PAY"
    commands: [{op: project.add_member, args: {project: PAY, person: "@ali", role: manager}}]
  - line: "take a baseline of WEB called Q4 baseline"
    commands: [{op: project.baseline.capture, args: {project: WEB, name: Q4 baseline}}]
  - line: "create a project Billing key BIL and then an epic Invoices under it"
    commands:
      - {op: project.create, args: {name: Billing, key: BIL}}
      - {op: item.create, args: {title: Invoices, type: epic, project: BIL}}
  # ---- items
  - line: "new epic Checkout redesign under WEB"
    commands: [{op: item.create, args: {title: Checkout redesign, type: epic, project: WEB}}]
  - line: "add a deliverable Data contract to the pipeline project"
