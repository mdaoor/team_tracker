# Golden set for the gateway command translator (/v1/translate/command), run with a SCRIPTED model.
# `commands`: what a correct translation is. `model` (optional): what the scripted model emits when it is imperfect (invented op,
# invented person/key, wrong arg). The pipeline (catalogue enum, schema validation, grounding) must absorb those. Without `model`
# the scripted model answers `commands` (that is the "good model" case; the real-model hook uses the same file).
# Metrics asserted in gateway_tests/test_translate_command.py: op accuracy >= 0.85, argument accuracy >= 0.90.
actor: "@mahmoud"
now: "2026-10-23T12:00:00+00:00"
tz: "Asia/Riyadh"
pack:
  context_schema_version: 1
  actor: "@mahmoud"
  workspace: acme
  projects:
    - {key: WEB, name: Website Refresh, aliases: [site]}
    - {key: DATA, name: Ingestion Pipeline, aliases: [ingest, the pipeline]}
    - {key: PAY, name: Payments, aliases: []}
  people: [{handle: "@sara"}, {handle: "@ali"}, {handle: "@omar"}, {handle: "@mahmoud"}]
  my_open_items:
    - {key: WEB-1, title: Landing page, project: WEB}
    - {key: WEB-2, title: Footer, project: WEB}
    - {key: WEB-3, title: Search box, project: WEB}
    - {key: WEB-4, title: Cookie banner, project: WEB}
    - {key: WEB-7, title: Checkout flow, project: WEB}
    - {key: WEB-101, title: Login, project: WEB}
    - {key: WEB-105, title: Login v2, project: WEB}
    - {key: WEB-110, title: OAuth exchange, project: WEB}
    - {key: DATA-1, title: Schema registry, project: DATA}
    - {key: DATA-2, title: Retry refactor, project: DATA}
    - {key: DATA-3, title: Backfill job, project: DATA}
    - {key: PAY-1, title: Gateway integration, project: PAY}
    - {key: PAY-2, title: Refund flow, project: PAY}
  tags: [q4, infra]
  milestones: [{name: Beta, project: WEB}]
  iterations: [{name: Sprint 14, project: WEB}, {name: Sprint 15, project: WEB}]
  risks: [{key: WEB-R7}]
  my_teams_with_members:
    - {name: payments, members: ["@sara", "@ali"]}
  pending_approvals: [{id: AP-12, title: scope change}, {id: AP-13, title: extra budget}]
  manager_rules: []
  glossary: {}
