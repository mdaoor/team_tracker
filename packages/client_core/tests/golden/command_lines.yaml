  - line: "create a story Guest checkout under WEB-7"
    commands: [{op: item.create, args: {title: Guest checkout, type: story, project: WEB, parent: WEB-7}}]
  - line: "change the description of WEB-1 to Landing page for the campaign"
    commands: [{op: item.update, args: {key: WEB-1, description: Landing page for the campaign}}]
  - line: "put WEB-2 and WEB-3 under WEB-1"
