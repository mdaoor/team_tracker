# Golden set for the deterministic management-command parser (tt_client.parser.commands).
# Each case: the typed line -> the exact commands (op + args, `_meta` ignored). `commands: []` = must fall through to the gateway.
# Pack used: tests/conftest.py (projects WEB, DATA; people @sara @ali; iteration "Sprint 14").
actor: "@mahmoud"
now: "2026-10-23T12:00:00+00:00"
cases:
  - line: "new epic Checkout redesign under WEB"
    commands: [{op: item.create, args: {title: Checkout redesign, type: epic, project: WEB}}]
  - line: "create a story Guest checkout in WEB"
    commands: [{op: item.create, args: {title: Guest checkout, type: story, project: WEB}}]
  - line: "new task fix the bug in login under WEB-142"
    commands: [{op: item.create, args: {title: fix the bug in login, type: task, project: WEB, parent: WEB-142}}]
  - line: "add deliverable Data contract for the pipeline"
    commands: [{op: item.create, args: {title: Data contract, type: deliverable, project: DATA}}]
  - line: "new project Payments key PAY scrum"
    commands: [{op: project.create, args: {name: Payments, key: PAY, methodology: scrum}}]
  - line: "create project Billing BIL"
    commands: [{op: project.create, args: {name: Billing, key: BIL}}]
  - line: "rename project WEB to Website 2"
    commands: [{op: project.update, args: {project: WEB, name: Website 2}}]
  - line: "baseline WEB as Q4 baseline"
    commands: [{op: project.baseline.capture, args: {project: WEB, name: Q4 baseline}}]
  - line: "add @sara to WEB as member"
    commands: [{op: project.add_member, args: {project: WEB, person: "@sara", role: member}}]
  - line: "add @sara and @ali to project DATA as lead"
    commands:
      - {op: project.add_member, args: {project: DATA, person: "@sara", role: lead}}
      - {op: project.add_member, args: {project: DATA, person: "@ali", role: lead}}
  - line: "merge WEB-101 and WEB-105"
    commands: [{op: item.merge, args: {sources: [WEB-101, WEB-105], target: WEB-101}}]
  - line: "merge WEB-101, WEB-105 and WEB-107"
    commands: [{op: item.merge, args: {sources: [WEB-101, WEB-105, WEB-107], target: WEB-101}}]
  - line: "merge WEB-101 and WEB-105 into WEB-110"
    commands: [{op: item.merge, args: {sources: [WEB-101, WEB-105], target: WEB-110}}]
  - line: "merge web-101 and web-105 into one"
    commands: [{op: item.merge, args: {sources: [WEB-101, WEB-105], target: WEB-101}}]
  - line: "merge WEB-101 and WEB-105 as Unified login flow"
    commands: [{op: item.merge, args: {sources: [WEB-101, WEB-105], new_title: Unified login flow}}]
  - line: "merge tag q-4 into q4"
    commands: [{op: tag.merge, args: {sources: [q-4], target: q4}}]
  - line: "split WEB-7 into Design and Build"
    commands: [{op: item.split, args: {key: WEB-7, titles: [Design, Build]}}]
  - line: "tag DATA-1 DATA-2 #q4"
    commands: [{op: item.tag, args: {keys: [DATA-1, DATA-2], add: [q4]}}]
  - line: "tag DATA-1 DATA-2 DATA-3 #q4 #infra"
    commands: [{op: item.tag, args: {keys: [DATA-1, DATA-2, DATA-3], add: [q4, infra]}}]
  - line: "untag DATA-1 #q4"
    commands: [{op: item.tag, args: {keys: [DATA-1], remove: [q4]}}]
  - line: "tag all open DATA items #q4"
    commands: []
  - line: "new tag q4"
    commands: [{op: tag.create, args: {name: q4}}]
  - line: "add value ACME to dimension customer"
    commands: [{op: dimension.value.add, args: {dimension: customer, value: ACME}}]
  - line: "classify WEB-1 customer ACME"
    commands: [{op: classify, args: {target: WEB-1, dimension: customer, value: ACME}}]
  - line: "create virtual team payments with @sara @ali led by me"
    commands: [{op: team.create, args: {name: payments, kind: virtual, members: ["@sara", "@ali"], lead: "@mahmoud"}}]
  - line: "new ad hoc team launch with @sara"
    commands: [{op: team.create, args: {name: launch, kind: ad_hoc, members: ["@sara"]}}]
  - line: "create team platform"
    commands: [{op: team.create, args: {name: platform, kind: virtual}}]
  - line: "add @ali to team payments"
    commands: [{op: team.add_members, args: {team: payments, members: ["@ali"]}}]
  - line: "remove @ali from team payments"
    commands: [{op: team.remove_members, args: {team: payments, members: ["@ali"]}}]
  - line: "@sara reports to me"
