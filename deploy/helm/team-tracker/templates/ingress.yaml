{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations: {{ toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls: [{hosts: [{{ .Values.ingress.host }}], secretName: {{ .Values.ingress.tlsSecret }}}]
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: {{ .Release.Name }}-server, port: {number: 8000}}}}
          - {path: /auth, pathType: Prefix, backend: {service: {name: {{ .Release.Name }}-server, port: {number: 8000}}}}
          - {path: /p, pathType: Prefix, backend: {service: {name: {{ .Release.Name }}-server, port: {number: 8000}}}}
          - {path: /healthz, pathType: Exact, backend: {service: {name: {{ .Release.Name }}-server, port: {number: 8000}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: {{ .Release.Name }}-web, port: {number: 80}}}}
{{- end }}
