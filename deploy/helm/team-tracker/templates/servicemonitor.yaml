{{- if .Values.metrics.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: {{ .Release.Name }}}
spec:
  selector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: server}}
  endpoints:
    - port: http
      path: /metrics
      authorization:
        credentials: {name: {{ .Values.existingSecret }}, key: TT_METRICS_TOKEN}
{{- end }}
