# nginx in front of Team Tracker on one host (scripts/prod/install.sh --mode proxy --nginx).
# nginx terminates HTTPS, serves the built web console and passes the API paths to uvicorn on 127.0.0.1:8000.
# Edit server_name and the two certificate paths, then: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name tracker.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tracker.example.com;

    ssl_certificate     /etc/tt/tls/cert.pem;      # full chain
    ssl_certificate_key /etc/tt/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 26m;                      # TT_ATTACHMENT_MAX_BYTES + headroom

    # Server-sent events (review queue live updates): no buffering. Listed before the generic /api rule (first regex match wins).
    location ~ ^/api/v1/.*/stream$ { proxy_pass http://127.0.0.1:8000; proxy_buffering off; proxy_read_timeout 1h;
                                     include /etc/nginx/conf.d/team-tracker.proxy; }

    # API, sign-in, public share links and health checks -> the API process
    location ~ ^/(api|auth|p)/ { proxy_pass http://127.0.0.1:8000; include /etc/nginx/conf.d/team-tracker.proxy; }
    location = /healthz        { proxy_pass http://127.0.0.1:8000; }
    location = /readyz         { proxy_pass http://127.0.0.1:8000; }
    location = /metrics        { proxy_pass http://127.0.0.1:8000; }   # still needs the TT_METRICS_TOKEN bearer

    # Web console (single-page app built by scripts/build.sh web)
    root /opt/team-tracker/apps/web/dist;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /        { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
